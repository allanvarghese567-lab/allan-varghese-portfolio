name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly rebuild keeps the calculated years of experience current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Do not set cache: npm unless package-lock.json is in the repo

      - name: Install dependencies
        run: npm install

      - name: Resolve OWNER / REPO from secrets
        id: creds
        env:
          SECRET_OWNER: ${{ secrets.NEXT_PUBLIC_GITHUB_OWNER }}
          SECRET_REPO: ${{ secrets.NEXT_PUBLIC_GITHUB_REPO }}
        run: |
          echo "owner=${SECRET_OWNER:-allanvarghese567-lab}" >> "$GITHUB_OUTPUT"
          echo "repo=${SECRET_REPO:-allan-varghese-portfolio}" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ steps.creds.outputs.owner }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ steps.creds.outputs.repo }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
